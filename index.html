<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        /* Background Video Styling */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.5);
        }

        /* Content Box */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.4);
            padding: 30px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            max-width: 90%;
            width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ff4d6d;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .heart {
            font-size: 40px;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop class="bg-video">
        <source src="Love.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Center Message -->
    <div class="container">
        <h1>Hey Cutie! ❤️</h1>
        <p>Yeh choti si website sirf aapke liye hai. Aap meri zindagi ka sabse khubsurat hissa ho. I love you so much! ✨</p>
        <div class="heart">❤️</div>
    </div>

</body>
</html>
